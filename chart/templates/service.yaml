apiVersion: v1
kind: Service
metadata:
  labels:
    app: {{  .Release.Name }}
  name: {{  .Release.Name }}-svc
  namespace: {{ .Values.namespace.name }}
spec:
  ports:
  - port: {{ .Values.service.port }}
    protocol: {{ .Values.service.protocol }}
    targetPort: {{ .Values.service.targetPort }}
  selector:
    app: {{  .Release.Name }}
  type: {{ .Values.service.type }}
